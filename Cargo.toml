[package]
name = "shop-cho-tai-nguyen-mmo"
version = "3.0.0"
edition = "2021"
description = "Chợ Tài Nguyên Mmo — backend Rust (Axum + SQLite) cho shop bán tài khoản mạng xã hội."

[[bin]]
name = "shop"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
scrypt = "0.11"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
mime_guess = "2"
hex = "0.4"

[profile.release]
opt-level = 2
